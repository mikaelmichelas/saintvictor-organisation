<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outils Saint Victor - Index</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #003478;
            --secondary: #c4268b;
            --light-bg: #f8f9fa;
            --dark-bg: #1a1a1a;
            --text-light: #333;
            --text-dark: #e0e0e0;
            --border: #ddd;
            --border-dark: #444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--light-bg);
            color: var(--text-light);
            transition: background 0.3s, color 0.3s;
        }

        body.dark-mode {
            background: var(--dark-bg);
            color: var(--text-dark);
        }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: white;
            color: var(--text-light);
            transition: border-color 0.3s;
        }

        body.dark-mode .search-box input {
            background: #333;
            color: var(--text-dark);
            border-color: var(--border-dark);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 2px solid var(--border);
            border-radius: 20px;
            background: white;
            color: var(--text-light);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        body.dark-mode .filter-btn {
            background: #333;
            color: var(--text-dark);
            border-color: var(--border-dark);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .theme-toggle {
            background: none;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        body.dark-mode .theme-toggle {
            border-color: var(--border-dark);
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        body.dark-mode .info-bar {
            color: var(--text-dark);
        }

        /* ACCORDÉONS PAR THÈME */
        .theme-section {
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: white;
        }

        body.dark-mode .theme-section {
            background: #2a2a2a;
            border-color: var(--border-dark);
        }

        .theme-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, rgba(0, 52, 120, 0.1) 0%, rgba(196, 38, 139, 0.1) 100%);
            cursor: pointer;
            user-select: none;
            transition: background 0.3s;
        }

        body.dark-mode .theme-header {
            background: linear-gradient(135deg, rgba(0, 52, 120, 0.3) 0%, rgba(196, 38, 139, 0.3) 100%);
        }

        .theme-header:hover {
            background: linear-gradient(135deg, rgba(0, 52, 120, 0.2) 0%, rgba(196, 38, 139, 0.2) 100%);
        }

        .theme-header h2 {
            font-size: 1.3rem;
            color: var(--primary);
            margin: 0;
        }

        body.dark-mode .theme-header h2 {
            color: #7fb3ff;
        }

        .theme-toggle-icon {
            font-size: 1.5rem;
            transition: transform 0.3s;
        }

        .theme-section.collapsed .theme-toggle-icon {
            transform: rotate(-90deg);
        }

        .theme-content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
            max-height: none;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .theme-section.collapsed .theme-content {
            display: none;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            background: white;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        body.dark-mode .card {
            background: #333;
            border-color: var(--border-dark);
        }

        .card:hover {
            box-shadow: 0 4px 12px rgba(0, 52, 120, 0.15);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
            gap: 1rem;
        }

        .card-header h2 {
            font-size: 1.1rem;
            margin: 0;
            flex: 1;
        }

        .card-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            white-space: nowrap;
        }

        .badge-public {
            background: #e3f2fd;
            color: var(--primary);
        }

        .badge-personnel {
            background: #fce4ec;
            color: var(--secondary);
        }

        body.dark-mode .badge-public {
            background: rgba(0, 52, 120, 0.3);
        }

        body.dark-mode .badge-personnel {
            background: rgba(196, 38, 139, 0.3);
        }

        .card-description {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 1rem;
            line-height: 1.5;
            flex: 1;
        }

        body.dark-mode .card-description {
            color: #aaa;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tag {
            display: inline-block;
            font-size: 0.8rem;
            padding: 0.25rem 0.65rem;
            background: #f0f0f0;
            color: #555;
            border-radius: 12px;
            font-weight: 500;
        }

        body.dark-mode .tag {
            background: #444;
            color: #bbb;
        }

        .card-links {
            display: flex;
            gap: 0.75rem;
            margin-top: auto;
        }

        .btn {
            flex: 1;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #002a5f;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: var(--primary);
        }

        body.dark-mode .btn-secondary {
            background: #444;
            color: #7fb3ff;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        body.dark-mode .btn-secondary:hover {
            background: #555;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #999;
        }

        body.dark-mode .empty-state {
            color: #666;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #999;
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
            margin-top: 3rem;
        }

        body.dark-mode footer {
            border-top-color: var(--border-dark);
            color: #666;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .container {
                padding: 1rem;
            }

            .controls {
                flex-direction: column;
            }

            .search-box {
                min-width: 100%;
            }

            .theme-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>📚 Outils Saint Victor</h1>
    <p>Découvrez tous les outils et pages de l'établissement</p>
</header>

<div class="container">
    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Chercher un outil...">
        </div>
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Tous</button>
            <button class="filter-btn" data-filter="public">🌐 Public</button>
            <button class="filter-btn" data-filter="personnel">🔒 Personnel</button>
        </div>
        <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>

    <div class="info-bar">
        <span id="resultCount"></span>
        <span id="toolCount"></span>
    </div>

    <div id="themesContainer"></div>

    <div id="emptyState" class="empty-state" style="display: none;">
        <p>Aucun outil ne correspond à votre recherche.</p>
    </div>
</div>

<footer>
    <p>Lycée Saint Victor, Valence · Index centralisé des outils internes</p>
</footer>

<script>
    const tools = [
        // saintvictor-rentree (4)
        {
            id: 'suivi-as',

        {

            access: 'public',
            theme: 'Pédagogie & Apprentissage',
            url: 'https://mikaelmichelas.github.io/saintvictor-rentree/infographie_absence_eval.html',
            repo: 'https://github.com/mikaelmichelas/saintvictor-rentree',
            tags: ['Protocoles', 'Absence', 'Processus']
        },
        // comptabilite (1)
        {
            id: 'heures-sup',
            title: 'Heures Supplémentaires',
            description: 'Outil de comptabilisation des heures supplémentaires. Suivi des heures de Claudine Parfait et Marie Le Gall. 🔐 Protégé par mot de passe.',
            access: 'personnel',
            theme: 'Suivi & Pilotage',
            url: 'https://mikaelmichelas.github.io/comptabilite/heures_sup.html',
            repo: 'https://github.com/mikaelmichelas/comptabilite',
            tags: ['Comptabilité', 'Pastorale', 'Suivi temps']
        },
        // saintvictor-organisation (4)
        {
            id: 'ap-synthese',
            title: 'AP - Synthèse',
            description: 'Vue synthétique de l\'accompagnement personnalisé. 🔐 Protégé par mot de passe (tous personnels).',
            access: 'personnel',
            theme: 'Pédagogie & Apprentissage',
            url: 'https://mikaelmichelas.github.io/saintvictor-organisation/ap-synthese.html',
            repo: 'https://github.com/mikaelmichelas/saintvictor-organisation',
            tags: ['AP', 'Accompagnement', 'Pédagogie']
        },
        {
            id: 'barrettes-1eres',
            title: 'Barrettes 1ères',
            description: 'Organisation des barrettes horaires pour les élèves de 1ère. Accès public.',
            access: 'public',
            theme: 'Suivi & Pilotage',
            url: 'https://mikaelmichelas.github.io/saintvictor-organisation/barrettes1eres.html',
            repo: 'https://github.com/mikaelmichelas/saintvictor-organisation',
            tags: ['Emploi du temps', '1ère', 'Barrettes']
        },
        {
            id: 'barrettes-tales',
            title: 'Barrettes Terminales',
            description: 'Organisation des barrettes horaires pour les élèves de terminale. ⚠️ Onglet PR privé (mot de passe).',
            access: 'public',
            theme: 'Suivi & Pilotage',
            url: 'https://mikaelmichelas.github.io/saintvictor-organisation/barrettesTales.html',
            repo: 'https://github.com/mikaelmichelas/saintvictor-organisation',
            tags: ['Emploi du temps', 'Terminale', 'Barrettes', 'PR privé']
        },
        {
            id: 'pix-campagnes',
            title: 'PIX - Campagnes Terminale',
            description: 'Suivi des campagnes PIX pour les élèves de terminale. Certifications, résultats.',
            access: 'public',
            theme: 'Pédagogie & Apprentissage',
            url: 'https://mikaelmichelas.github.io/saintvictor-organisation/pix-campagnes-terminale.html',
            repo: 'https://github.com/mikaelmichelas/saintvictor-organisation',
            tags: ['PIX', 'Terminale', 'Compétences numériques']
        },
        // orientation (8)
        {
            id: 'ap-orientation',
            title: 'AP - Orientation',
            description: 'Accompagnement personnalisé orientation. Ressources et suivi pour les élèves.',
            access: 'public',
            theme: 'Orientation',
            url: 'https://mikaelmichelas.github.io/orientation/ap-orientation.html',
            repo: 'https://github.com/mikaelmichelas/orientation',
            tags: ['Orientation', 'AP', 'Accompagnement']
        },
        {
            id: 'barrettes-orientation',
            title: 'Barrettes - Orientation',
            description: 'Vue barrettes pour l\'orientation. Structuration par niveau et options.',
            access: 'public',
            theme: 'Orientation',
            url: 'https://mikaelmichelas.github.io/orientation/barrettes.html',
            repo: 'https://github.com/mikaelmichelas/orientation',
            tags: ['Orientation', 'Barrettes', 'Structure']
        },
        {

            description: 'Page d\'accueil du pôle orientation. Point central pour toutes les ressources orientation.',
            access: 'public',
            theme: 'Orientation',
            url: 'https://mikaelmichelas.github.io/orientation/index.html',
            repo: 'https://github.com/mikaelmichelas/orientation',
            tags: ['Orientation', 'Accueil', 'Hub']
        },
        {
            id: 'jdo-formulaire',
            title: 'JDO - Formulaire Inscription Présentations',
            description: 'Formulaire web pour la saisie des choix de présentations JDO. Intégration Google Sheets, sans doublon.',
            access: 'public',
            theme: 'Orientation',
            url: 'https://mikaelmichelas.github.io/orientation/jdo_formulaire.html',
            repo: 'https://github.com/mikaelmichelas/orientation',
            tags: ['Orientation', 'Formulaire', 'Rentrée']
        },
        {
            id: 'rdv-orientation',
            title: 'RDV Orientation',
            description: 'Prise de rendez-vous pour les consultations orientation. Planification avec les élèves.',
            access: 'public',
            theme: 'Orientation',
            url: 'https://mikaelmichelas.github.io/orientation/rdv-orientation.html',
            repo: 'https://github.com/mikaelmichelas/orientation',
            tags: ['Orientation', 'RDV', 'Consultation']
        },
        // tremplins (3)
        {
            id: 'tremplins-dashboard',
            title: 'Tremplins Sup - Dashboard',
            description: 'Tableau de bord Tremplins Sup. Vue synthétique pour direction, secrétaire, comptabilité. 🔐 Protégé par mot de passe.',
            access: 'personnel',
            theme: 'Orientation',
            url: 'https://mikaelmichelas.github.io/tremplins/dashboard.html',
            repo: 'https://github.com/mikaelmichelas/tremplins',
            tags: ['Tremplins Sup', 'Dashboard', 'Suivi']
        },
        {
            id: 'tremplins-accueil',
            title: 'Tremplins Sup - Accueil',
            description: 'Page d\'accueil du dispositif Tremplins Sup. Informations et ressources pour élèves et familles.',
            access: 'public',
            theme: 'Orientation',
            url: 'https://mikaelmichelas.github.io/tremplins/index.html',
            repo: 'https://github.com/mikaelmichelas/tremplins',
            tags: ['Tremplins Sup', 'Accueil', 'Dispositif']
        },
        {
            id: 'tremplins-planning',
            title: 'Tremplins Sup - Planning',
            description: 'Calendrier et planning des sessions Tremplins Sup. Dates clés, inscriptions.',
            access: 'public',
            theme: 'Orientation',
            url: 'https://mikaelmichelas.github.io/tremplins/planning.html',
            repo: 'https://github.com/mikaelmichelas/tremplins',
            tags: ['Tremplins Sup', 'Planning', 'Calendrier']
        },
        {
            id: 'padlet-orientation',
            title: 'Padlet Orientation',
            description: 'Tableau collaboratif Padlet pour le partage de ressources orientation. Lien direct vers le padlet de suivi orientation.',
            access: 'public',
            theme: 'Orientation',
            url: 'https://padlet.com/Padlet_Orientation/orientation-saint-victor-valence-zcnbkfsr9e17j3kw',
            repo: 'https://padlet.com',
            tags: ['Orientation', 'Ressources', 'Collaboratif']
        }
    ];

    // État global
    let currentFilter = 'all';
    let currentSearch = '';

    // Éléments DOM
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const themesContainer = document.getElementById('themesContainer');
    const emptyState = document.getElementById('emptyState');
    const resultCount = document.getElementById('resultCount');
    const toolCount = document.getElementById('toolCount');
    const themeToggle = document.getElementById('themeToggle');

    // Thème
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        updateThemeToggle();
    });

    function updateThemeToggle() {
        themeToggle.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    }

    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
    updateThemeToggle();

    // Recherche & filtres
    searchInput.addEventListener('input', (e) => {
        currentSearch = e.target.value.toLowerCase();
        render();
    });

    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            render();
        });
    });

    // Filtrage
    function filterTools() {
        return tools.filter(tool => {
            const matchesFilter = currentFilter === 'all' || tool.access === currentFilter;
            const matchesSearch = currentSearch === '' ||
                tool.title.toLowerCase().includes(currentSearch) ||
                tool.description.toLowerCase().includes(currentSearch) ||
                tool.tags.some(tag => tag.toLowerCase().includes(currentSearch));
            return matchesFilter && matchesSearch;
        });
    }

    // Grouper par thème
    function groupByTheme(filteredTools) {
        const grouped = {};
        filteredTools.forEach(tool => {
            if (!grouped[tool.theme]) {
                grouped[tool.theme] = [];
            }
            grouped[tool.theme].push(tool);
        });
        return grouped;
    }

    // Rendu principal
    function render() {
        const filtered = filterTools();
        themesContainer.innerHTML = '';

        if (filtered.length === 0) {
            emptyState.style.display = 'block';
            resultCount.textContent = '';
            toolCount.textContent = '';
            return;
        }

        emptyState.style.display = 'none';
        resultCount.textContent = `${filtered.length} outil${filtered.length > 1 ? 's' : ''} trouvé${filtered.length > 1 ? 's' : ''}`;
        toolCount.textContent = `${tools.length} outils au total`;

        const grouped = groupByTheme(filtered);
        const themes = Object.keys(grouped).sort();

        themes.forEach(theme => {
            const section = document.createElement('div');
            section.className = 'theme-section';

            const header = document.createElement('div');
            header.className = 'theme-header';
            header.innerHTML = `
                <h2>${theme}</h2>
                <span class="theme-toggle-icon">▼</span>
            `;

            header.addEventListener('click', () => {
                section.classList.toggle('collapsed');
            });

            const content = document.createElement('div');
            content.className = 'theme-content';

            grouped[theme].forEach(tool => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <h2>${tool.title}</h2>
                        <span class="card-badge badge-${tool.access}">
                            ${tool.access === 'public' ? '🌐 Public' : '🔒 Personnel'}
                        </span>
                    </div>
                    <p class="card-description">${tool.description}</p>
                    <div class="card-tags">
                        ${tool.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                    <div class="card-links">
                        <a href="${tool.url}" target="_blank" class="btn btn-primary">Accéder</a>
                        <a href="${tool.repo}" target="_blank" class="btn btn-secondary">Code</a>
                    </div>
                `;
                content.appendChild(card);
            });

            section.appendChild(header);
            section.appendChild(content);
            themesContainer.appendChild(section);
        });
    }

    // Rendu initial
    render();
</script>

</body>
</html>
