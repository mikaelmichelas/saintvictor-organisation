<html lang="fr">
<head>
    <meta charset="UTF-8">

    <title>Outils Saint Victor - Index</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #003478;
            --secondary: #c4268b;
            --light-bg: #f8f9fa;
            --dark-bg: #1a1a1a;
            --text-light: #333;
            --text-dark: #e0e0e0;
            --border: #ddd;
            --border-dark: #444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--light-bg);
            color: var(--text-light);
            transition: background 0.3s, color 0.3s;
        }

        body.dark-mode {
            background: var(--dark-bg);
            color: var(--text-dark);
        }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: white;
            color: var(--text-light);
            transition: border-color 0.3s;
        }

        body.dark-mode .search-box input {
            background: #333;
            color: var(--text-dark);
            border-color: var(--border-dark);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 2px solid var(--border);
            border-radius: 20px;
            background: white;
            color: var(--text-light);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        body.dark-mode .filter-btn {
            background: #333;
            color: var(--text-dark);
            border-color: var(--border-dark);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .theme-toggle {
            background: none;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        body.dark-mode .theme-toggle {
            border-color: var(--border-dark);
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        body.dark-mode .info-bar {
            color: var(--text-dark);
        }

        /* ACCORDÉONS PAR THÈME */
        .theme-section {
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: white;
        }

        body.dark-mode .theme-section {
            background: #2a2a2a;
            border-color: var(--border-dark);
        }

        .theme-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, rgba(0, 52, 120, 0.1) 0%, rgba(196, 38, 139, 0.1) 100%);
            cursor: pointer;
            user-select: none;
            transition: background 0.3s;
        }

        body.dark-mode .theme-header {
            background: linear-gradient(135deg, rgba(0, 52, 120, 0.3) 0%, rgba(196, 38, 139, 0.3) 100%);
        }

        .theme-header:hover {
            background: linear-gradient(135deg, rgba(0, 52, 120, 0.2) 0%, rgba(196, 38, 139, 0.2) 100%);
        }

        .theme-header h2 {
            font-size: 1.3rem;
            color: var(--primary);
            margin: 0;
        }

        body.dark-mode .theme-header h2 {
            color: #7fb3ff;
        }

        .theme-toggle-icon {
            font-size: 1.5rem;
            transition: transform 0.3s;
        }

        .theme-section.collapsed .theme-toggle-icon {
            transform: rotate(-90deg);
        }

        .theme-content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
            max-height: none;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .theme-section.collapsed .theme-content {
            display: none;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            background: white;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        body.dark-mode .card {
            background: #333;
            border-color: var(--border-dark);
        }

        .card:hover {
            box-shadow: 0 4px 12px rgba(0, 52, 120, 0.15);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
            gap: 1rem;
        }

        .card-header h2 {
            font-size: 1.1rem;
            margin: 0;
            flex: 1;
        }

        .card-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            white-space: nowrap;
        }

        .badge-public {
            background: #e3f2fd;
            color: var(--primary);
        }

        .badge-personnel {
            background: #fce4ec;
            color: var(--secondary);
        }

        body.dark-mode .badge-public {
            background: rgba(0, 52, 120, 0.3);
        }

        body.dark-mode .badge-personnel {
            background: rgba(196, 38, 139, 0.3);
        }

        .card-description {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 1rem;
            line-height: 1.5;
            flex: 1;
        }

        body.dark-mode .card-description {
            color: #aaa;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tag {
            display: inline-block;
            font-size: 0.8rem;
            padding: 0.25rem 0.65rem;
            background: #f0f0f0;
            color: #555;
            border-radius: 12px;
            font-weight: 500;
        }

        body.dark-mode .tag {
            background: #444;
            color: #bbb;
        }

        .card-links {
            display: flex;
            gap: 0.75rem;
            margin-top: auto;
        }

        .btn {
            flex: 1;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #002a5f;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: var(--primary);
        }

        body.dark-mode .btn-secondary {
            background: #444;
            color: #7fb3ff;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        body.dark-mode .btn-secondary:hover {
            background: #555;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #999;
        }

        body.dark-mode .empty-state {
            color: #666;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #999;
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
            margin-top: 3rem;
        }

        body.dark-mode footer {
            border-top-color: var(--border-dark);
            color: #666;
        }



        /* RUBRIQUE VERROUILLÉE */
        .locked-box {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            color: #666;
        }

        body.dark-mode .locked-box {
            color: #aaa;
        }

        .unlock-form {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .unlock-form input {
            padding: 0.6rem 1rem;
            font-size: 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: white;
            color: var(--text-light);
        }

        body.dark-mode .unlock-form input {
            background: #333;
            color: var(--text-dark);
            border-color: var(--border-dark);
        }

        .unlock-form input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .unlock-form .btn {
            flex: none;
        }

        .unlock-err {
            color: var(--secondary);
            font-size: 0.9rem;
            min-height: 1.2rem;
        }

        .lock-btn {
            margin-left: auto;
            margin-right: 1rem;
            padding: 0.3rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
        }

        body.dark-mode .lock-btn {
            background: #444;
            border-color: var(--border-dark);
            color: #7fb3ff;
        }

        /* MENU HORIZONTAL */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            gap: 0.5rem;
            padding: 0.6rem 1rem;
            background: white;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            overflow-x: auto;
            white-space: nowrap;
            justify-content: center;
        }

        body.dark-mode .top-nav {
            background: #222;
            border-bottom-color: var(--border-dark);
        }

        .top-nav a {
            padding: 0.45rem 1rem;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--primary);
            background: #f0f0f0;
            transition: all 0.2s;
        }

        .top-nav a:hover {
            background: var(--primary);
            color: white;
        }

        body.dark-mode .top-nav a {
            background: #444;
            color: #7fb3ff;
        }

        body.dark-mode .top-nav a:hover {
            background: var(--primary);
            color: white;
        }

        .theme-section {
            scroll-margin-top: 70px;
        }

        html {
            scroll-behavior: smooth;
        }

        @media (max-width: 768px) {
            .top-nav {
                justify-content: flex-start;
            }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .container {
                padding: 1rem;
            }

            .controls {
                flex-direction: column;
            }

            .search-box {
                min-width: 100%;
            }

            .theme-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    // Rubrique Perso : cards chiffrées (AES-GCM, clé dérivée du mot de passe par PBKDF2)
    const PERSO_ENC = { iter: 600000, salt: 'MhOGMHhSEjwG9u2TtXsJwQ==', iv: '6ikO2ImdvAKgtzWG', data: 'cPkCMjuxxy9WNCWfDVb62NDn3tbv/IWkfN3JCAMT4t2In2dTJH+5ZSNjicoPZzvRUZtNXhdLwsTiDHquIKUENuJOGbjGGOSZpgSiTYefocYZN0a//Bn7G0nNq+vpTeKwFv5jTxVVAaqtBJc1d+LPgVPy7+OMpYmb4jBFAlo4hziz+WN6/t7WsunDOo4iF7KiWqVKrx47welsT9jbPZkei4lIOyj5sRy0bJeFkP3ouR0W3F72QGNQklkHpLJXryfX3hAQSTl4+qMqCzRDVlRyd/4L39beS8MYJz5GNnqBaIjEzX2rZE4zUNg/gq+z/GpugvAFF8/8UgvJgxFQqGSkSud5UIjxO9R48zDSsBzTujusg7bycrT+CvfCREdIsEGoGboxE47+4P8jOXoXVAel3Mc3gAZBWlKOqKoqxhvb6dVITdu4p+G37h1dI5iPMmo6AP24cH9v/zACYd7LDftbs6I6t4yqYqlWHEwLDmBnzjlCNtFLVc0kNcvxPAEYna2xtTwaxAdIvmJihB02pXUo5TMqp67muEJVyxdTAUGJLIEuz3YH/CK+fe0OGnEjTzEspte53WjltE0sfiDONpNQC0HYfwI2kR1vlTTpOLjFEELBPLoAddOMmsihPefuiIb7/BDwXtdCuWV3+B0mk5Eu75yFX0GmeUPBqTLuJ4bnPwx5xOr0tZ1c3EaclwUe+EJbkeM2MTs/1AHPVxKR2n6rJAY89ytWE5Gpuw9kGrJRl99pa8SxuGdvm+Wb3CRnKapA0eGLMKM7zUjGYNvuXFURSMf/Rh5wD5JlkQOx9oTvqL8zfuOyNJDPhgz9uGs50Q23BpmM9+zVcd6vBb+QqpuqKnTcDNmPRPuVyhibSu81DWg18ORJ37ohbY0MApqDq2lsjj1HHEn+NQD3/TWjB5fmW/i08ROEz50N/VO/sWn8BRDYoHjPpZX0FwgD2+HuMDqEWJt4FDntQeQ2Lwivp81DdDLLIfAS5pK7bMs4YUM2rMt6rC0HAu09v3LaWNm3HGlJhA/avalYnBwYyTAC1GredMxtO0D7Q+4UgbVnwaQUExnG6JjbBr/2gVojgcxl+PlRlgb+Uqx59OPklyXPR7z3oXYsUZRo55NvysDOvepVS1lOKR+VJ6Mx73T6dmxBQjSqNiJ5l08gK9ebAAMeJY9KIw8cQ9mT5loD939hEeGH8KypbZVJp8WYC/VrH2q86jXwAucqDTaBUlFLLVdlvDuAigJ2YqSM97Z31uIOPNxUWGmB9tBB+4Fm12Ck2nLxAn1/cncIXtk78l84iARaxRYQlOD0UKZ18xXOE2Tv+V+9joeRob+O9tLRPCiFYMhDtE7iM2pp' };
    let persoTools = [];
    let persoUnlocked = false;

    function allTools() {
        return persoUnlocked ? tools.concat(persoTools) : tools;
    }

    async function unlockPerso(pw) {
        try {
            const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
            const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
            const key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: b64(PERSO_ENC.salt), iterations: PERSO_ENC.iter, hash: 'SHA-256' },
                km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
            const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PERSO_ENC.iv) }, key, b64(PERSO_ENC.data));
            const json = new TextDecoder().decode(buf);
            persoTools = JSON.parse(json);
            persoUnlocked = true;
            try { sessionStorage.setItem('persoData', json); } catch (e) {}
            return true;
        } catch (e) {
            return false;
        }
    }

    function lockPerso() {
        persoTools = [];
        persoUnlocked = false;
        try { sessionStorage.removeItem('persoData'); } catch (e) {}
        render();
    }

    try {
        const saved = sessionStorage.getItem('persoData');
        if (saved) { persoTools = JSON.parse(saved); persoUnlocked = true; }
    } catch (e) {}

    // État global
    let currentFilter = 'all';
    let currentSearch = '';

    // Éléments DOM
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const themesContainer = document.getElementById('themesContainer');
    const emptyState = document.getElementById('emptyState');
    const resultCount = document.getElementById('resultCount');
    const toolCount = document.getElementById('toolCount');
    const themeToggle = document.getElementById('themeToggle');

    // Thème
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        updateThemeToggle();
    });

    function updateThemeToggle() {
        themeToggle.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    }

    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
    updateThemeToggle();

    // Recherche & filtres
    searchInput.addEventListener('input', (e) => {
        currentSearch = e.target.value.toLowerCase();
        render();
    });

    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            render();
        });
    });

    // Filtrage
    function filterTools() {
        return allTools().filter(tool => {
            const matchesFilter = currentFilter === 'all' || tool.access === currentFilter;
            const matchesSearch = currentSearch === '' ||
                tool.title.toLowerCase().includes(currentSearch) ||
                tool.description.toLowerCase().includes(currentSearch) ||
                tool.tags.some(tag => tag.toLowerCase().includes(currentSearch));
            return matchesFilter && matchesSearch;
        });
    }

    // Grouper par thème
    function groupByTheme(filteredTools) {
        const grouped = {};
        filteredTools.forEach(tool => {
            if (!grouped[tool.theme]) {
                grouped[tool.theme] = [];
            }
            grouped[tool.theme].push(tool);
        });
        return grouped;
    }

    // Section Perso verrouillée
    function buildLockedSection() {
        const section = document.createElement('div');
        section.className = 'theme-section';
        section.id = themeId('Perso');

        const header = document.createElement('div');
        header.className = 'theme-header';
        header.style.cursor = 'default';
        header.innerHTML = '<h2>Perso 🔒</h2>';

        const box = document.createElement('div');
        box.className = 'locked-box';
        box.innerHTML = `
            <p>Rubrique verrouillée.</p>
            <form class="unlock-form" autocomplete="off">
                <input type="password" placeholder="Mot de passe">
                <button type="submit" class="btn btn-primary">Déverrouiller</button>
            </form>
            <div class="unlock-err"></div>
        `;
        const input = box.querySelector('input');
        const err = box.querySelector('.unlock-err');
        box.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (await unlockPerso(input.value)) {
                render();
                const target = document.getElementById(themeId('Perso'));
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else {
                err.textContent = 'Mot de passe incorrect.';
                input.value = '';
                input.focus();
            }
        });

        section.appendChild(header);
        section.appendChild(box);
        return section;
    }

    // Menu horizontal
    const topNav = document.getElementById('topNav');

    function themeId(theme) {
        return 'rubrique-' + theme.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    function renderNav(themes, grouped) {
        topNav.innerHTML = '';
        themes.forEach(theme => {
            const link = document.createElement('a');
            link.href = '#' + themeId(theme);
            link.textContent = (theme === 'Perso' && !persoUnlocked) ? 'Perso 🔒' : `${theme} (${grouped[theme].length})`;
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const target = document.getElementById(themeId(theme));
                if (!target) return;
                target.classList.remove('collapsed');
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
            topNav.appendChild(link);
        });
    }

    // Rendu principal
    function render() {
        const filtered = filterTools();
        themesContainer.innerHTML = '';
        const showLocked = !persoUnlocked && currentSearch === '' && currentFilter === 'all';

        if (filtered.length === 0 && !showLocked) {
            emptyState.style.display = 'block';
            topNav.innerHTML = '';
            resultCount.textContent = '';
            toolCount.textContent = '';
            return;
        }

        emptyState.style.display = 'none';
        resultCount.textContent = `${filtered.length} outil${filtered.length > 1 ? 's' : ''} trouvé${filtered.length > 1 ? 's' : ''}`;
        toolCount.textContent = `${allTools().length} outils au total`;

        const grouped = groupByTheme(filtered);
        if (showLocked) grouped['Perso'] = [];
        const themeOrder = ['Orientation', 'Les Tremplins', 'Pédagogie & Apprentissage', 'Suivi & Pilotage', 'Perso'];
        const themes = Object.keys(grouped).sort((x, y) => {
            const ix = themeOrder.indexOf(x), iy = themeOrder.indexOf(y);
            return (ix === -1 ? 99 : ix) - (iy === -1 ? 99 : iy) || x.localeCompare(y);
        });
        renderNav(themes, grouped);

        themes.forEach(theme => {
            if (theme === 'Perso' && !persoUnlocked) {
                themesContainer.appendChild(buildLockedSection());
                return;
            }
            const section = document.createElement('div');
            section.className = 'theme-section';
            section.id = themeId(theme);

            const header = document.createElement('div');
            header.className = 'theme-header';
            header.innerHTML = `
                <h2>${theme}</h2>
                ${theme === 'Perso' ? '<button type="button" class="lock-btn">🔓 Verrouiller</button>' : ''}
                <span class="theme-toggle-icon">▼</span>
            `;
            const lockBtn = header.querySelector('.lock-btn');
            if (lockBtn) {
                lockBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    lockPerso();
                });
            }

            header.addEventListener('click', () => {
                section.classList.toggle('collapsed');
            });

            const content = document.createElement('div');
            content.className = 'theme-content';

            grouped[theme].forEach(tool => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <h2>${tool.title}</h2>
                        <span class="card-badge badge-${tool.access}">
                            ${tool.access === 'public' ? '🌐 Public' : (tool.theme === 'Suivi & Pilotage' ? 'Direction✍🏻' : '🔒 Personnel')}
                        </span>
                    </div>
                    <p class="card-description">${tool.description}</p>
                    <div class="card-tags">
                        ${tool.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                    <div class="card-links">
                        ${(tool.links || [{ label: 'Accéder', url: tool.url }]).map(l => `<a href="${l.url}" target="_blank" class="btn btn-primary">${l.label}</a>`).join('')}
                        ${tool.repo ? `<a href="${tool.repo}" target="_blank" class="btn btn-secondary">Code</a>` : ''}
                    </div>
                `;
                content.appendChild(card);
            });

            section.appendChild(header);
            section.appendChild(content);
            themesContainer.appendChild(section);
        });
    }

    // Rendu initial
    render();
</script>
